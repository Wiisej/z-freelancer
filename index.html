<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z Freelancer</title>
<style>
  :root{--g:#0f7b4a;--g2:#e6f4ec;--ink:#1c2321;--mut:#6a7570;--bd:#dfe5e2;--bg:#f6f8f7;--red:#c0392b;--amb:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
  .brand{font-weight:800;color:var(--g);font-size:18px;flex:1}
  nav{display:flex;gap:4px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--bd);overflow-x:auto}
  nav button{border:0;background:none;padding:8px 12px;border-radius:999px;font:inherit;color:var(--mut);white-space:nowrap;cursor:pointer}
  nav button.on{background:var(--g2);color:var(--g);font-weight:700}
  main,.wrap{max-width:720px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
  h2{margin:0 0 10px;font-size:20px} h3{margin:0 0 4px;font-size:17px}
  .muted{color:var(--mut);font-size:14px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sp{flex:1}
  label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff}
  textarea{min-height:90px;resize:vertical}
  .chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:6px 0}
  .chk input{width:auto}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:480px){.grid{grid-template-columns:1fr}}
  button.btn,a.btn{display:inline-block;border:0;background:var(--g);color:#fff;padding:10px 16px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
  .btn.sec{background:var(--g2);color:var(--g)} .btn.red{background:#fdecea;color:var(--red)}
  .btn.sm{padding:6px 11px;font-size:14px} .btn.full{width:100%;margin-top:14px;display:block}
  .btn.big{padding:14px 16px;font-size:17px}
  button:disabled{opacity:.55;cursor:default}
  .tag{display:inline-block;background:var(--g2);color:var(--g);padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600}
  .tag.amb{background:#fdf3dc;color:var(--amb)} .tag.red{background:#fdecea;color:var(--red)} .tag.gray{background:#eceeed;color:var(--mut)}
  .price{font-weight:800;color:var(--g)}
  .link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;padding:0}
  a.link{display:inline-block}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal.hidden{display:none}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
  @media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c2321;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90%}
  .applicant{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:#fff;border-radius:10px;font:inherit;cursor:pointer}
  .tabs button.on{background:var(--g2);border-color:var(--g);color:var(--g);font-weight:700}
  .av{border-radius:50%;object-fit:cover;background:var(--g2);color:var(--g);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none;overflow:hidden}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center}
  .stat b{display:block;font-size:20px;color:var(--g)} .stat span{font-size:12px;color:var(--mut)}
  .note{background:var(--g2);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
  .phone{display:flex;align-items:stretch}
  .phone span{padding:11px 12px;background:var(--g2);border:1px solid var(--bd);border-right:0;border-radius:10px 0 0 10px;font-weight:800;color:var(--g)}
  .phone input{border-radius:0 10px 10px 0}
  .gallery{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .gallery .thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);display:block}
  .gallery.big .thumb{width:calc(50vw - 28px);max-width:150px;height:110px}
  .linkbox{width:100%;font-size:13px;background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<footer style="text-align:center;padding:18px 14px;color:#6a7570;font-size:13px">© 2026 Z Freelancer · Created by Uncle Jonah. All rights reserved.</footer>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<datalist id="areas"></datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* Your Supabase keys and website address are in config.js (next to this file). */

const CATEGORIES = ['Lawn & garden','Cleaning','Errands & delivery','Moving & lifting','Handyman & repairs','Painting','Laundry & ironing','Car washing','Cooking & catering','Other'];
const AREAS = ['Kabulonga','Woodlands','Roma','Chelston','Kalingalinga','Matero','Chilenje','Chawama','Libala','Olympia','Northmead','Rhodes Park','Avondale','Chainda','Emmasdale','Makeni','Chamba Valley','Ibex Hill','Kalundu','Lilayi','Chilanga','Kabwata','Garden','Woodlands Extension'];
const PAY_METHODS = ['Cash','MTN Mobile Money','Airtel Money','Zamtel Kwacha','Bank transfer','Other'];

const cfgOk = typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined' && !SUPABASE_URL.includes('YOUR-PROJECT');
const sb = cfgOk ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const state = { session:null, profile:null, phone:'', view:null, authMode:'login', jobs:{}, photos:{}, adminTab:'people', posted:null, manage:null, manageToken:null };
const app = document.getElementById('app');
const $ = (s, r=document) => r.querySelector(s);

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'K' + Number(n).toLocaleString('en-US', {maximumFractionDigits:2});
const fmtDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : 'Flexible';
const ago = ts => { const m = Math.floor((Date.now() - new Date(ts)) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + 'm ago'; const h = Math.floor(m/60); if (h < 24) return h + 'h ago'; return Math.floor(h/24) + 'd ago'; };
const phoneDigits = p => { let d = String(p||'').replace(/\D/g,''); if (d.startsWith('0')) d = '260' + d.slice(1); return d; };
const phoneEmail = p => phoneDigits(p) + '@phone.zfreelancer.app';
const toLoginEmail = id => String(id||'').includes('@') ? id.trim() : phoneEmail(id);
const waLink = (phone, msg) => { const d = phoneDigits(phone); return d ? `https://wa.me/${d}?text=${encodeURIComponent(msg||'')}` : null; };
/* Phone: "+26" is pre-typed, the person types their 10-digit number starting with 0 (e.g. 0971234567) */
const phoneField = value => `<div class="phone"><span>+26</span><input name="phone" type="tel" inputmode="numeric" pattern="0[0-9]{9}" minlength="10" maxlength="10" required placeholder="0971234567" value="${esc(value)}" title="10 digits starting with 0, e.g. 0971234567"></div>`;
const localPhone = ph => { const d = phoneDigits(ph); return d.startsWith('260') && d.length === 12 ? '0' + d.slice(3) : ''; };
const validPhone = p => /^0\d{9}$/.test(String(p || ''));
document.addEventListener('input', e => { if (e.target.matches('input[name=phone]')) e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10); });
const stars = s => s && s.review_count > 0 ? `★ ${s.avg_rating} (${s.review_count})` : 'New';
const opts = (list, sel) => list.map(x => `<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const initials = n => String(n||'?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
const avatar = (url, name, size=40) => url
  ? `<img class="av" style="width:${size}px;height:${size}px" src="${esc(url)}" alt="">`
  : `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.4)}px">${esc(initials(name))}</span>`;
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),4200); }
function openModal(html){ $('#sheet').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#areas').innerHTML = AREAS.map(a => `<option value="${esc(a)}">`).join('');
const siteUrl = () => (typeof SITE_URL !== 'undefined' && SITE_URL && !SITE_URL.includes('YOUR-NAME')) ? SITE_URL : (location.origin + location.pathname);

const tabsFor = () => {
  const t = [['jobs','Find jobs'],['applications','My applications'],['profile','Profile']];
  if (state.profile && state.profile.is_admin) t.push(['admin','Admin']);
  return t;
};

async function getStats(ids){
  ids = [...new Set(ids)].filter(Boolean); if (!ids.length) return {};
  const { data } = await sb.from('profile_stats').select('*').in('user_id', ids);
  return Object.fromEntries((data||[]).map(s => [s.user_id, s]));
}
async function getPhones(ids){
  ids = [...new Set(ids)].filter(Boolean); if (!ids.length) return {};
  const { data } = await sb.from('private_contacts').select('*').in('user_id', ids);
  return Object.fromEntries((data||[]).map(c => [c.user_id, c.phone]));
}
async function getHirerPhones(jobIds){
  jobIds = [...new Set(jobIds)].filter(Boolean); if (!jobIds.length) return {};
  const { data } = await sb.from('job_private').select('job_id,hirer_phone').in('job_id', jobIds);
  return Object.fromEntries((data||[]).map(c => [c.job_id, c.hirer_phone]));
}
async function getLocations(ids){
  ids = [...new Set(ids)].filter(Boolean); if (!ids.length) return {};
  const { data } = await sb.from('job_locations').select('*').in('job_id', ids);
  return Object.fromEntries((data||[]).map(l => [l.job_id, l]));
}
async function getPhotos(ids){
  ids = [...new Set(ids)].filter(Boolean); if (!ids.length) return {};
  const { data } = await sb.from('job_photos').select('*').in('job_id', ids).order('position');
  const m = {}; (data||[]).forEach(p => (m[p.job_id] = m[p.job_id] || []).push(p.path)); return m;
}
const photoUrl = path => sb.storage.from('job-photos').getPublicUrl(path).data.publicUrl;
const gallery = (paths, big) => paths && paths.length
  ? `<div class="gallery ${big?'big':''}">${paths.map(p => `<a href="${esc(photoUrl(p))}" target="_blank" rel="noopener"><img class="thumb" src="${esc(photoUrl(p))}" alt="Photo of the work" loading="lazy"></a>`).join('')}</div>` : '';

/* ---------- photos: resize in the browser to save data ---------- */
function resizeImage(file, max = 512, quality = 0.85){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Could not process the photo')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not a photo')); };
    img.src = url;
  });
}
async function uploadAvatar(file){
  const { data: { session } } = await sb.auth.getSession();
  const uid = session.user.id, path = `${uid}/avatar.jpg`;
  const blob = await resizeImage(file, 512);
  const { error } = await sb.storage.from('avatars').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
  if (error) throw error;
  const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
  const { error: e2 } = await sb.from('profiles').update({ avatar_url: url }).eq('id', uid);
  if (e2) throw e2;
}
document.addEventListener('change', e => {
  if (e.target.matches('input[type=file][name=photo]')) {
    const f = e.target.files[0], box = document.getElementById('photoPrev');
    if (f && box) box.innerHTML = `<img class="av" style="width:96px;height:96px" src="${URL.createObjectURL(f)}" alt="">`;
  }
  if (e.target.matches('input[type=file][name=photos]')) {
    const box = document.getElementById('photosPrev'), fs = [...e.target.files].slice(0, 4);
    if (box) box.innerHTML = fs.map(f => `<img class="thumb" src="${URL.createObjectURL(f)}" alt="">`).join('');
    if (e.target.files.length > 4) toast('Only the first 4 photos will be used');
  }
});
const photoField = (current, name, required) => `<label>Profile photo ${required ? '(required)' : ''}</label>
  <div class="row"><div id="photoPrev">${current ? avatar(current, name, 96) : '<span class="av" style="width:96px;height:96px;font-size:34px">📷</span>'}</div>
  <div class="sp"><input name="photo" type="file" accept="image/*" ${required?'required':''}><div class="muted" style="margin-top:4px">A clear photo of your face. Admins check it before approving you.</div></div></div>`;

/* ---------- job location: hirer pin + landmark; worker map + navigation ---------- */
const locationFields = loc => {
  const has = loc && loc.latitude != null && loc.longitude != null;
  return `<div class="note" style="margin-top:14px"><b>Where is the job?</b>
    <div class="muted" style="margin:2px 0 8px">Only the worker you accept will see the exact location. Everyone else only sees the area.</div>
    <input type="hidden" name="latitude" value="${has ? loc.latitude : ''}"><input type="hidden" name="longitude" value="${has ? loc.longitude : ''}">
    <div class="row"><button type="button" class="btn sm" data-act="useGps">📍 Use my current location</button><button type="button" class="link" data-act="clearGps">Clear pin</button></div>
    <div class="gpsStatus muted" style="margin:6px 0">${has ? '✓ Location pinned' : 'No pin yet. Tap the button while you are at the job site.'}</div>
    <label>Landmark or address</label><input name="address_note" maxlength="300" value="${esc(loc ? loc.address_note : '')}" placeholder="e.g. Plot 12, opposite Chilenje Market, blue gate"></div>`;
};
function navBlock(loc, j){
  const has = loc.latitude != null && loc.longitude != null;
  const dest = has ? `${loc.latitude},${loc.longitude}` : encodeURIComponent([loc.address_note, j.area, 'Zambia'].filter(Boolean).join(', '));
  const base = `https://www.google.com/maps/dir/?api=1&destination=${dest}`;
  const la = loc.latitude, lo = loc.longitude, d = 0.004;
  const map = has ? `<iframe title="Job location map" loading="lazy" style="width:100%;height:190px;border:1px solid var(--bd);border-radius:10px;margin-top:8px" src="${esc(`https://www.openstreetmap.org/export/embed.html?bbox=${(lo-d).toFixed(5)},${(la-d*0.75).toFixed(5)},${(lo+d).toFixed(5)},${(la+d*0.75).toFixed(5)}&layer=mapnik&marker=${la},${lo}`)}"></iframe>` : '';
  return `<div class="note"><b>📍 Job location</b>${loc.address_note ? `<div>${esc(loc.address_note)}</div>` : ''}${map}
    <div class="row" style="margin-top:8px"><a class="btn sm" target="_blank" rel="noopener" href="${esc(base + '&travelmode=driving')}">Navigate</a>
    <a class="btn sm sec" target="_blank" rel="noopener" href="${esc(base + '&travelmode=walking')}">Walking directions</a></div></div>`;
}

/* ---------- routing: guests use #/post and #/manage/<private token> ---------- */
const route = () => {
  const h = location.hash || '';
  if (h.startsWith('#/manage/')) return { page:'manage', token: decodeURIComponent(h.slice(9)) };
  if (h === '#/post') return { page:'post' };
  return { page:'app' };
};
window.addEventListener('hashchange', () => { if (route().page !== 'post') state.posted = null; render(); window.scrollTo(0,0); });

/* ---------- startup & worker auth ---------- */
async function init(){
  if (!cfgOk) { app.innerHTML = '<div class="wrap"><div class="card"><h2>Setup needed</h2><p>Open <b>config.js</b> and paste your Supabase URL and anon key. See README.md.</p></div></div>'; return; }
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === 'SIGNED_OUT') { state.session = null; state.profile = null; render(); }
    else if (ev === 'SIGNED_IN') {
      state.session = s;
      if (state.profile) return;
      setTimeout(async () => { await loadProfile(); render(); }, 0);
    }
  });
  if (state.session) await loadProfile();
  render();
}

async function loadProfile(){
  const uid = state.session.user.id;
  const { data: p } = await sb.from('profiles').select('*').eq('id', uid).single();
  const { data: c } = await sb.from('private_contacts').select('phone').eq('user_id', uid).single();
  state.profile = p; state.phone = c ? c.phone : '';
  if (p) { const tabs = tabsFor(); if (!state.view || !tabs.some(t => t[0] === state.view)) state.view = tabs[0][0]; }
}

function renderAuth(){
  const su = state.authMode === 'signup';
  app.innerHTML = `<div class="wrap">
    <div class="card" style="text-align:center"><div class="brand" style="font-size:26px">Z Freelancer</div>
    <p class="muted">Find odd jobs. Find people to do them.</p>
    <a class="btn big full" href="#/post">📋 I need something done: post a job</a>
    <div class="muted" style="margin-top:6px">No account needed</div></div>
    <div class="card"><h3>Looking for work?</h3>
      <div class="tabs" style="margin-top:8px"><button data-act="authMode" data-m="login" class="${su?'':'on'}">Log in</button><button data-act="authMode" data-m="signup" class="${su?'on':''}">Sign up as a worker</button></div>
      <form data-form="${su?'signup':'login'}">
        ${su ? `<div class="grid"><div><label>First name</label><input name="first_name" required maxlength="50" autocomplete="given-name"></div>
        <div><label>Last name</label><input name="last_name" required maxlength="50" autocomplete="family-name"></div></div>
        <label>Phone (WhatsApp number, 10 digits)</label>${phoneField('')}
        <label>Your area</label><input name="area" list="areas" placeholder="e.g. Chilenje" required>
        ${photoField('', '', true)}
        <label>Email (optional)</label><input name="email" type="email" autocomplete="email" placeholder="Leave blank if you don't have one">`
        : `<label>Phone number or email</label><input name="login_id" required autocomplete="username" placeholder="0971234567">`}
        <label>Password</label><input name="password" type="password" minlength="6" required autocomplete="${su?'new-password':'current-password'}">
        <button class="btn full">${su?'Create account':'Log in'}</button>
      </form>
      ${su ? '<p class="muted" style="margin-bottom:0">New worker accounts are checked by an admin before you can apply for jobs. This usually takes a short while.</p>' : ''}
    </div></div>`;
}

function renderPhotoGate(){
  const p = state.profile;
  app.innerHTML = `<div class="wrap"><div class="card"><h2>Add your profile photo</h2>
    <p class="muted">Hi ${esc(p.first_name || p.full_name)}! A profile photo is required so hirers can trust who they choose.</p>
    <form data-form="photo">${photoField('', p.full_name, true)}<button class="btn full">Save photo</button></form>
    <p style="margin-bottom:0"><button class="link" data-act="logout">Log out</button></p></div></div>`;
}

function renderWaiting(kind){
  const p = state.profile;
  app.innerHTML = `<div class="wrap"><div class="card" style="text-align:center">
    ${avatar(p.avatar_url, p.full_name, 96)}
    <h2 style="margin-top:10px">${kind === 'pending' ? 'Waiting for approval' : 'Account not approved'}</h2>
    <p class="muted">${kind === 'pending'
      ? `Thanks ${esc(p.first_name || p.full_name)}! An admin is checking your details. You'll be able to see and apply for jobs as soon as you're approved.`
      : 'Your account was not approved. If you think this is a mistake, please contact support.'}</p>
    <div class="row" style="justify-content:center">${kind === 'pending' ? '<button class="btn" data-act="refresh">Check again</button>' : ''}<button class="btn sec" data-act="logout">Log out</button></div>
  </div></div>`;
}

/* ---------- main shell (workers and admins) ---------- */
function render(){
  const r = route();
  if (!cfgOk) return;
  if (r.page === 'post') return renderGuestPost();
  if (r.page === 'manage') return renderManage(r.token);
  if (!state.session) return renderAuth();
  const p = state.profile;
  if (!p) { app.innerHTML = '<p class="muted wrap">Loading…</p>'; return; }
  if (p.is_suspended) { app.innerHTML = '<div class="wrap"><div class="card"><h2>Account suspended</h2><p>Your account has been suspended after reports. Contact support if you think this is a mistake.</p><button class="btn" data-act="logout">Log out</button></div></div>'; return; }
  if (!p.is_admin) {
    if (!p.avatar_url) return renderPhotoGate();
    if (p.approval_status === 'pending') return renderWaiting('pending');
    if (p.approval_status === 'rejected') return renderWaiting('rejected');
  }
  const tabs = tabsFor();
  app.innerHTML = `<header>${avatar(p.avatar_url, p.full_name, 32)}<div class="brand">Z Freelancer</div>
    <a class="btn sec sm" href="#/post">Post a job</a>
    <button class="link" data-act="logout">Log out</button></header>
    <nav>${tabs.map(t => `<button data-act="goto" data-v="${t[0]}" class="${state.view===t[0]?'on':''}">${t[1]}</button>`).join('')}</nav>
    <main id="content"></main>`;
  (views[state.view] || views.profile)($('#content'));
}

/* ---------- WORKER: find jobs ---------- */
function jobCard(j, applied, photos){
  return `<div class="card"><div class="row"><h3 class="sp">${esc(j.title)}</h3><span class="price">${money(j.budget)}</span></div>
    <div class="row" style="margin:4px 0"><span class="tag">${esc(j.category)}</span><span class="muted">📍 ${esc(j.area)}</span><span class="muted">📅 ${fmtDate(j.job_date)}</span></div>

async function viewJobs(el){

    <label class="chk"><input type="checkbox" id="fMine" ${p.categories.length?'checked':''}> Only my categories</label></div>
    <div id="list"><p class="muted">Loading…</p></div>`;
  const [{ data: jobs, error }, { data: mine }] = await Promise.all([
    sb.from('jobs').select('*').eq('status','open').eq('approval_status','approved').order('created_at',{ascending:false}).limit(150),
    sb.from('applications').select('job_id').eq('worker_id', p.id)
  ]);
  if (error) return toast(error.message);
  const applied = new Set((mine||[]).map(a => a.job_id));
  (jobs||[]).forEach(j => state.jobs[j.id] = j);
  state.photos = await getPhotos((jobs||[]).map(j => j.id));
  const draw = () => {
    const cat = $('#fCat',el).value, q = $('#fQ',el).value.toLowerCase(), onlyMine = $('#fMine',el).checked;
    const rows = (jobs||[]).filter(j => (!cat || j.category === cat)
      && (!onlyMine || !p.categories.length || p.categories.includes(j.category))
      && (!q || (j.title + ' ' + j.description + ' ' + j.area).toLowerCase().includes(q)));

}

    .eq('worker_id', state.profile.id).order('created_at',{ascending:false});
  if (error) return toast(error.message);
  const list = (apps||[]).filter(a => a.job);
  const accepted = list.filter(a => a.status === 'accepted');
  const assignedIds = accepted.filter(a => a.job.status === 'assigned').map(a => a.job.id);
  const [phones, locs] = await Promise.all([getHirerPhones(accepted.map(a => a.job.id)), getLocations(assignedIds)]);
  el.innerHTML = '<h2>My applications</h2>' + (list.length ? list.map(a => {
    const j = a.job, hn = j.hirer_name || 'the hirer';
    const wa = a.status === 'accepted' ? waLink(phones[j.id], `Hi ${hn}, I'm the worker you accepted for "${j.title}" on Z Freelancer.`) : null;
    const tag = a.status === 'accepted' ? '<span class="tag">Accepted</span>' : a.status === 'rejected' ? '<span class="tag gray">Not selected</span>' : '<span class="tag amb">Pending</span>';
    let pay = '';
    if (a.status === 'accepted' && j.status === 'completed') {

        <div class="row" style="margin-top:8px"><button class="btn sm" data-act="confirmReceived" data-id="${j.id}">Yes, I received it</button>
        <button class="btn sm red" data-act="report" data-job="${j.id}">Not received</button></div></div>`;
      else pay = '<div class="note">Job completed. Waiting for the hirer to pay you.</div>';
    }
    let nav = '';
    if (a.status === 'accepted' && j.status === 'assigned')
      nav = locs[j.id] ? navBlock(locs[j.id], j) : '<div class="note">The hirer has not shared the exact location yet. Message them on WhatsApp.</div>';
    return `<div class="card"><div class="row"><h3 class="sp">${esc(j.title)}</h3>${tag}</div>
      <p class="muted" style="margin:4px 0">${esc(j.category)} · 📍 ${esc(j.area)} · your offer <b>${money(a.offer_price)}</b></p>
      ${a.status === 'accepted' ? `<div class="muted">Hirer: <b>${esc(j.hirer_name)}</b></div>` : ''}${nav}${pay}

      ${a.status==='accepted' ? `<button class="link" data-act="report" data-job="${j.id}">Report</button>` : ''}</div></div>`;

}

async function renderManage(token){
  state.manageToken = token;
  app.innerHTML = '<div class="wrap"><p class="muted">Loading your job…</p></div>';
  const { data, error } = await sb.rpc('guest_get_job', { p_token: token });
  if (route().page !== 'manage' || state.manageToken !== token) return;
  if (error) { app.innerHTML = `<div class="wrap"><div class="card"><h2>Something went wrong</h2><p>${esc(error.message)}</p><button class="btn" data-act="gRefresh">Try again</button></div></div>`; return; }
  if (!data) { app.innerHTML = '<div class="wrap"><div class="card"><h2>Job not found</h2><p class="muted">This link is not valid. Check that you copied the whole link.</p><a class="btn" href="#/post">Post a job</a></div></div>'; return; }
  state.manage = data; drawManage();
}

function drawManage(){
  const d = state.manage, j = d.job, loc = d.location, photos = d.photos || [], apps = d.applications || [];
  const acc = apps.find(a => a.status === 'accepted');
  const stag = { open:'<span class="tag">Open</span>', assigned:'<span class="tag amb">In progress</span>', completed:'<span class="tag gray">Completed</span>', cancelled:'<span class="tag red">Cancelled</span>' };
  let tag = stag[j.status], body = '';
  if (j.status === 'open' && j.approval_status === 'pending') { tag = '<span class="tag amb">Waiting for approval</span>'; body = '<div class="note">An admin is checking your job. Workers will see it once it is approved. Open this page again later to see who applied.</div>'; }
  else if (j.status === 'open' && j.approval_status === 'rejected') { tag = '<span class="tag red">Not approved</span>'; body = '<div class="note">This job was not approved, so workers cannot see it.</div>'; }
  else if (j.status === 'open') {
    body = apps.length ? apps.map(a => { const w = a.worker; return `<div class="applicant">
      <div class="row">${avatar(w.avatar_url, w.full_name, 48)}<div class="sp"><b>${esc(w.full_name)}</b>
      <div class="muted">${stars(w)} · ${w.jobs_done || 0} jobs done · 📍 ${esc(w.area)}</div></div><span class="price">${money(a.offer_price)}</span></div>
      ${a.note ? `<p style="margin:6px 0">${esc(a.note)}</p>` : ''}
      ${w.categories && w.categories.length ? `<div class="muted">Does: ${esc(w.categories.join(', '))}</div>` : ''}
      <div class="row" style="margin-top:6px"><button class="btn sm" data-act="gAccept" data-id="${a.id}">Choose ${esc(w.full_name.split(' ')[0])}</button></div></div>`; }).join('')
      : '<p class="muted" style="margin:8px 0 0">No applicants yet. Check back soon.</p>';
  } else if (acc) {
    const w = acc.worker, wa = waLink(w.phone, `Hi ${w.full_name.split(' ')[0]}, about "${j.title}" on Z Freelancer.`);
    let pay = '';
    if (j.status === 'completed') {
      if (j.payment_status === 'unpaid') pay = `<button class="btn sm" data-act="gPay" data-amount="${acc.offer_price}" data-name="${esc(w.full_name)}">Confirm payment</button>`;
      else if (j.payment_status === 'paid_by_hirer') pay = `<span class="tag amb">Paid ${money(j.paid_amount)} · waiting for ${esc(w.full_name.split(' ')[0])} to confirm</span>`;
      else pay = '<span class="tag">Payment confirmed ✓</span>';
    }
    body = `<div class="applicant"><div class="muted">Your worker</div><div class="row">${avatar(w.avatar_url, w.full_name, 56)}<div class="sp"><b>${esc(w.full_name)}</b>
      <div class="muted">${stars(w)} · ${w.jobs_done || 0} jobs done</div></div><span class="price">${money(acc.offer_price)}</span></div>
      <div class="row" style="margin-top:8px">${wa ? `<a class="btn sm" target="_blank" rel="noopener" href="${wa}">WhatsApp ${esc(w.full_name.split(' ')[0])}</a>` : ''}
      ${j.status === 'assigned' ? '<button class="btn sm sec" data-act="gComplete">Mark job completed</button>' : ''}
      ${pay}
      ${j.status === 'completed' && !d.reviewed ? `<button class="btn sm sec" data-act="gRate" data-name="${esc(w.full_name)}">Rate worker</button>` : ''}
      ${j.status === 'completed' && d.reviewed ? '<span class="tag gray">Rated ✓</span>' : ''}
      <button class="link" data-act="gReport">Report a problem</button></div></div>`;
  }
  if (j.status === 'open' || j.status === 'assigned') {
    body += `<div class="row" style="margin-top:10px"><span class="muted sp">${loc ? (loc.latitude != null ? '📍 Pin saved' : '📍 Landmark saved') : '📍 No location yet'}</span>
      <button class="btn sm sec" data-act="gLoc">${loc ? 'Edit' : 'Add'} location</button></div>`;
  }
  if (j.status === 'open') body += '<div style="margin-top:10px"><button class="btn sm red" data-act="gCancel">Cancel job</button></div>';
  app.innerHTML = `<div class="wrap">
    <div class="row" style="margin-bottom:8px"><span class="brand">Z Freelancer</span><button class="btn sec sm" data-act="gRefresh">Refresh</button></div>
    <div class="card"><div class="row"><h2 class="sp" style="margin:0">${esc(j.title)}</h2>${tag}</div>
      <div class="row" style="margin:6px 0"><span class="tag">${esc(j.category)}</span><span class="muted">📍 ${esc(j.area)}</span><span class="muted">📅 ${fmtDate(j.job_date)}</span><span class="price sp" style="text-align:right">${money(j.budget)}</span></div>
      ${j.description ? `<p style="margin:6px 0">${esc(j.description)}</p>` : ''}
      ${gallery(photos, true)}${body}</div>
    <div class="card muted">This page is private to you. Anyone with this link can manage this job, so don't share it. <a href="#/post">Post another job</a></div></div>`;
}

/* ---------- click actions ---------- */
const rpc = async (fn, args, okMsg) => {
  const { error } = await sb.rpc(fn, args);
  if (error) return toast(error.message);
  if (okMsg) toast(okMsg);
  render();
};
const grpc = async (fn, args, okMsg) => {
  const { error } = await sb.rpc(fn, { p_token: state.manageToken, ...args });
  if (error) { toast(error.message); return false; }
  if (okMsg) toast(okMsg);
  await renderManage(state.manageToken); return true;
};
const act = {
  authMode: d => { state.authMode = d.m; renderAuth(); },
  logout: async () => { await sb.auth.signOut(); },
  refresh: async () => { await loadProfile(); render(); },
  goto: d => { state.view = d.v; render(); window.scrollTo(0,0); },
  adminTab: d => { state.adminTab = d.t; render(); },

  openJob: async d => {
    const j = state.jobs[d.id]; if (!j) return;
    const { data: mine } = await sb.from('applications').select('*').eq('job_id', j.id).eq('worker_id', state.profile.id).maybeSingle();
    openModal(`<h2>${esc(j.title)}</h2>
      <div class="row"><span class="tag">${esc(j.category)}</span><span class="muted">📍 ${esc(j.area)}</span><span class="muted">📅 ${fmtDate(j.job_date)}</span><span class="price sp" style="text-align:right">${money(j.budget)}</span></div>
      <p>${esc(j.description) || '<span class="muted">No extra details.</span>'}</p>
      ${gallery(state.photos[j.id], true)}
      <p class="muted">Posted by ${esc(j.hirer_name || 'a hirer')}. The exact location is shared once you are chosen.</p>
      ${mine ? `<div class="note">You applied with an offer of <b>${money(mine.offer_price)}</b>. Status: <b>${mine.status}</b>.</div>` : `
      <form data-form="apply" data-job="${j.id}">
        <label>Your price (Kwacha)</label><input name="offer_price" type="number" min="0" step="1" required value="${Number(j.budget)}">
        <label>Message to the hirer</label><textarea name="note" maxlength="500" placeholder="Say when you can come and what you'll bring"></textarea>
        <button class="btn full">Send application</button></form>`}
      <div class="row" style="margin-top:12px"><button class="btn sec sm" data-act="closeModal">Close</button><span class="sp"></span>
      <button class="link" data-act="report" data-job="${j.id}">Report this job</button></div>`);
  },
  closeModal: () => closeModal(),
  withdraw: async d => { const { error } = await sb.from('applications').delete().eq('id', d.id); if (error) return toast(error.message); toast('Application withdrawn'); render(); },
  confirmReceived: async d => { if (confirm('Confirm that you received this payment?')) await rpc('worker_confirm_payment', { p_job: d.id }, 'Payment confirmed. Thank you!'); },
  report: d => openModal(`<h2>Report</h2><form data-form="report" data-job="${d.job||''}" data-user="${d.user||''}">
    <label>What happened?</label><textarea name="reason" required minlength="3" maxlength="500" placeholder="Fake job, payment not received, abusive, tried to take it off the app…"></textarea>
    <button class="btn red full">Send report</button></form>`),
  reviewUser: async d => { if (d.s === 'rejected' && !confirm('Reject this person?')) return; await rpc('admin_review_user', { p_user: d.user, p_status: d.s }, d.s === 'approved' ? 'Approved' : 'Rejected'); },
  reviewJob: async d => { if (d.s === 'rejected' && !confirm('Reject this job?')) return; await rpc('admin_review_job', { p_job: d.id, p_status: d.s }, d.s === 'approved' ? 'Job approved' : 'Job rejected'); },
  suspend: async d => { await rpc('admin_set_suspended', { p_user: d.user, p_flag: d.flag === 'true' }, 'Done'); },
  adminDeleteJob: async d => { if (!confirm('Delete this job permanently?')) return; const { error } = await sb.from('jobs').delete().eq('id', d.id); if (error) return toast(error.message); toast('Job deleted'); render(); },

  /* location pin (used when posting and when editing) */
  useGps: (d, t) => {
    const f = t.closest('form'), st = f.querySelector('.gpsStatus');
    if (!navigator.geolocation) return toast('This phone cannot share its location. Type a landmark instead.');
    st.textContent = 'Getting your location…';
    navigator.geolocation.getCurrentPosition(pos => {
      f.elements.latitude.value = pos.coords.latitude.toFixed(6);
      f.elements.longitude.value = pos.coords.longitude.toFixed(6);
      st.textContent = `✓ Location pinned (accurate to about ${Math.round(pos.coords.accuracy)} m)`;
    }, () => { st.textContent = 'Could not get your location. Allow location access, or type a landmark instead.'; },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  },
  clearGps: (d, t) => { const f = t.closest('form'); f.elements.latitude.value = ''; f.elements.longitude.value = ''; f.querySelector('.gpsStatus').textContent = 'No pin yet.'; },

  /* guest hirer actions */
  copyLink: async () => {
    const box = document.getElementById('mlink');
    try { await navigator.clipboard.writeText(box.value); toast('Link copied'); }
    catch (e) { box.select(); document.execCommand && document.execCommand('copy'); toast('Link copied'); }
  },
  postAnother: () => { state.posted = null; renderGuestPost(); },
  gRefresh: () => renderManage(state.manageToken),
  gAccept: async d => { if (confirm('Choose this worker? The other applicants will be declined.')) await grpc('guest_accept', { p_app_id: d.id }, 'Worker chosen. You can now WhatsApp them.'); },
  gComplete: async () => { if (confirm('Mark this job as completed?')) await grpc('guest_complete', {}, 'Job completed. Now confirm your payment.'); },
  gCancel: async () => { if (confirm('Cancel this job?')) await grpc('guest_cancel', {}, 'Job cancelled'); },
  gPay: d => openModal(`<h2>Confirm payment</h2><p class="muted">Confirm that you paid ${esc(d.name)}. They will then be asked to confirm they received it.</p>
    <form data-form="gPayment"><label>Amount paid (Kwacha)</label><input name="amount" type="number" min="0" step="1" required value="${Number(d.amount)}">
      <label>How did you pay?</label><select name="method">${opts(PAY_METHODS)}</select>
      <label>Reference or transaction ID (optional)</label><input name="ref" maxlength="80" placeholder="e.g. mobile money transaction ID">
      <button class="btn full">I have paid</button></form>`),
  gRate: d => openModal(`<h2>Rate ${esc(d.name)}</h2><form data-form="gRate">
    <label>Rating</label><select name="rating"><option value="5">★★★★★ Excellent</option><option value="4">★★★★ Good</option><option value="3">★★★ OK</option><option value="2">★★ Poor</option><option value="1">★ Bad</option></select>
    <label>Comment (optional)</label><textarea name="comment" maxlength="500"></textarea>
    <button class="btn full">Submit rating</button></form>`),
  gReport: () => openModal(`<h2>Report a problem</h2><form data-form="gReport">
    <label>What happened?</label><textarea name="reason" required minlength="3" maxlength="500" placeholder="No-show, bad behaviour, asked for more money…"></textarea>
    <button class="btn red full">Send report</button></form>`),
  gLoc: () => openModal(`<h2>Job location</h2><form data-form="gLocation">${locationFields(state.manage.location)}
    <button class="btn full">Save location</button></form><div style="margin-top:10px"><button class="btn sec sm" data-act="closeModal">Close</button></div>`)
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && act[t.dataset.act]) { e.preventDefault(); act[t.dataset.act](t.dataset, t); } });

/* ---------- form handlers ---------- */
const forms = {
  login: async f => {
    const v = Object.fromEntries(new FormData(f));
    const { error } = await sb.auth.signInWithPassword({ email: toLoginEmail(v.login_id), password: v.password });
    if (error) toast(error.message === 'Invalid login credentials' ? 'Wrong phone/email or password' : error.message);
  },
  signup: async f => {
    const v = Object.fromEntries(new FormData(f)), photo = f.elements.photo.files[0];
    if (!photo) return toast('Please add a profile photo');
    if (!validPhone(v.phone)) return toast('Phone number must be 10 digits starting with 0, e.g. 0971234567');
    const first = v.first_name.trim(), last = v.last_name.trim();
    const email = (v.email || '').trim() || phoneEmail(v.phone);
    const { data, error } = await sb.auth.signUp({ email, password: v.password, options: { data: {
      first_name: first, last_name: last, full_name: first + ' ' + last, phone: '+26' + v.phone, area: v.area.trim(),
      is_worker: true, is_hirer: false } } });
    if (error) return toast(error.message);
    if (!data.session) { state.authMode = 'login'; renderAuth(); toast('Check your email to confirm, then log in and add your photo.'); return; }
    state.session = data.session;
    try { await uploadAvatar(photo); } catch (err) { toast('Account created, but the photo did not upload. Add it on the next screen.'); }
    await loadProfile(); render();
  },
  photo: async f => {
    const photo = f.elements.photo.files[0];
    if (!photo) return toast('Please choose a photo');
    try { await uploadAvatar(photo); } catch (err) { return toast(err.message || 'Photo upload failed'); }
    await loadProfile(); toast('Photo saved'); render();
  },
  apply: async f => {
    const v = Object.fromEntries(new FormData(f));
    const { error } = await sb.from('applications').insert({ job_id: f.dataset.job, worker_id: state.profile.id, offer_price: Number(v.offer_price), note: v.note.trim() });
    if (error) return toast(error.code === '23505' ? 'You already applied to this job' : error.message);
    closeModal(); toast('Application sent'); render();
  },
  report: async f => {
    const v = Object.fromEntries(new FormData(f));
    const { error } = await sb.from('reports').insert({ reporter_id: state.profile.id, reported_user_id: f.dataset.user || null, job_id: f.dataset.job || null, reason: v.reason.trim() });
    if (error) return toast(error.message);
    closeModal(); toast('Report sent. We will review it.');
  },
  profile: async f => {
    const fd = new FormData(f), v = Object.fromEntries(fd), photo = f.elements.photo.files[0];
    if (!validPhone(v.phone)) return toast('Phone number must be 10 digits starting with 0, e.g. 0971234567');
    const { error } = await sb.from('profiles').update({ first_name: v.first_name.trim(), last_name: v.last_name.trim(), area: v.area.trim(), bio: v.bio.trim(),
      categories: fd.getAll('cat'), available: !!v.available }).eq('id', state.profile.id);
    if (error) return toast(error.message);
    const { error: e2 } = await sb.from('private_contacts').update({ phone: '+26' + v.phone }).eq('user_id', state.profile.id);
    if (e2) return toast(e2.message);
    if (photo) { try { await uploadAvatar(photo); } catch (err) { toast('Saved, but the photo did not upload: ' + (err.message || '')); } }
    await loadProfile(); toast('Profile saved'); render();
  },

  /* guest hirer forms */
  guestPost: async f => {
    const v = Object.fromEntries(new FormData(f)), files = [...f.elements.photos.files].slice(0, 4);
    if (!validPhone(v.phone)) return toast('Phone number must be 10 digits starting with 0, e.g. 0971234567');
    if (!v.latitude && !v.address_note.trim()) return toast('Add a pin or a landmark so the worker can find you');
    const { data, error } = await sb.rpc('create_guest_job', { p_name: v.name.trim(), p_phone: '+26' + v.phone, p_title: v.title.trim(),
      p_description: v.description.trim(), p_category: v.category, p_area: v.area.trim(), p_budget: Number(v.budget), p_date: v.job_date || null,
      p_lat: v.latitude ? Number(v.latitude) : null, p_lng: v.longitude ? Number(v.longitude) : null, p_note: v.address_note.trim() });
    if (error) return toast(error.message);
    const { out_job_id: jobId, out_token: token } = data[0];
    const paths = []; let failed = 0;
    for (let i = 0; i < files.length; i++) {
      try {
        const blob = await resizeImage(files[i], 1280, 0.8), path = `${jobId}/${i + 1}.jpg`;
        const { error: ue } = await sb.storage.from('job-photos').upload(path, blob, { contentType:'image/jpeg' });
        if (ue) throw ue; paths.push(path);
      } catch (e) { failed++; }
    }
    if (paths.length) { const { error: pe } = await sb.rpc('add_job_photos', { p_token: token, p_paths: paths }); if (pe) failed += paths.length; }
    state.posted = { token, phone: '+26' + v.phone, title: v.title.trim(), failed };
    render();
  },
  gPayment: async f => {
    const v = Object.fromEntries(new FormData(f));
    if (await grpc('guest_confirm_payment', { p_method: v.method, p_ref: v.ref.trim(), p_amount: Number(v.amount) }, 'Payment recorded. The worker will now confirm.')) closeModal();
  },
  gRate: async f => {
    const v = Object.fromEntries(new FormData(f));
    if (await grpc('guest_review_worker', { p_rating: Number(v.rating), p_comment: v.comment.trim() }, 'Thanks for your rating')) closeModal();
  },
  gReport: async f => {
    const v = Object.fromEntries(new FormData(f));
    const { error } = await sb.rpc('guest_report', { p_token: state.manageToken, p_reason: v.reason.trim() });
    if (error) return toast(error.message);
    closeModal(); toast('Report sent. We will review it.');
  },
  gLocation: async f => {
    const v = Object.fromEntries(new FormData(f));
    if (!v.latitude && !v.address_note.trim()) return toast('Add a pin or a landmark');
    if (await grpc('guest_set_location', { p_lat: v.latitude ? Number(v.latitude) : null, p_lng: v.longitude ? Number(v.longitude) : null, p_note: v.address_note.trim() }, 'Location saved')) closeModal();
  }
};
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const b = f.querySelector('button:not([type=button])'); if (b) b.disabled = true;
  try { await forms[f.dataset.form](f); }
  catch (err) { toast(err && err.message ? err.message : 'Something went wrong'); }
  finally { if (b) b.disabled = false; }
});

init();
</script>
</body>
</html>
